<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ink Fantasy Maps</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <nav class="top-nav" aria-label="Pages"><a href="/gallery/">Gallery</a></nav>
    <h1>Ink Fantasy Maps</h1>
    <p class="tag">Hand-inked region maps, drawn fresh from a single number.</p>
  </header>

  <div class="layout">
    <form id="settings" class="panel" aria-label="Map settings">
      <label class="field">
        <span>Seed</span>
        <span class="seed-row">
          <input id="seed" type="number" min="0" max="999999999" step="1" inputmode="numeric" required>
        </span>
        <small>Each map has a seed. Type one and press Enter to bring that map back.</small>
      </label>

      <label class="field">
        <span>Shape</span>
        <select id="shape">
          <option value="portrait">Portrait (A-paper shape)</option>
          <option value="landscape">Landscape (A-paper shape)</option>
        </select>
      </label>

      <label class="field">
        <span>Sea level <output id="sea-out" for="sea"></output></span>
        <input id="sea" type="range" min="5" max="90" step="1">
      </label>

      <label class="field">
        <span>Mountains <output id="mountains-out" for="mountains"></output></span>
        <input id="mountains" type="range" min="0" max="100" step="1">
      </label>

      <label class="field">
        <span>Forests <output id="forest-out" for="forest"></output></span>
        <input id="forest" type="range" min="0" max="100" step="1">
      </label>

      <label class="field">
        <span>Towns <output id="towns-out" for="towns"></output></span>
        <input id="towns" type="range" min="1" max="15" step="1">
      </label>

      <label class="check"><input id="show-relief" type="checkbox"> Show shaded relief</label>

      <button type="submit" class="generate">Generate a new map</button>

      <div class="exports" role="group" aria-labelledby="share-title">
        <span id="share-title" class="group-title">Share this map</span>
        <input id="share-link" type="text" readonly aria-label="Link to this map">
        <button type="button" id="copy-link" class="plain">Copy link</button>
        <output id="share-status" aria-live="polite"></output>
        <small class="fine">The link rebuilds this map, with your edits.</small>
      </div>

      <div class="exports" role="group" aria-labelledby="keep-title">
        <span id="keep-title" class="group-title">Keep this map</span>
        <label class="field"><span>Name</span><input id="map-name" type="text" maxlength="60" autocomplete="off"></label>
        <button type="button" id="save-mine" class="plain">Save to My maps</button>
        <button type="button" id="publish" class="plain">Publish to the public gallery</button>
        <output id="keep-status" aria-live="polite"></output>
        <small class="fine">My maps stay in this browser. Publishing shares the map, its name and a small picture with everyone. <a href="/gallery/">Open the gallery</a></small>
      </div>

      <div class="exports" role="group" aria-labelledby="export-title">
        <span id="export-title" class="group-title">Save the map</span>
        <button type="button" id="export-svg" class="plain">SVG (any size)</button>
        <button type="button" id="export-png" class="plain">PNG for screen</button>
        <button type="button" id="export-a3" class="plain">PNG for A3 print (300 dpi)</button>
        <output id="export-status" aria-live="polite"></output>
      </div>
    </form>

    <figure class="stage">
      <div class="toolbar">
        <button type="button" id="edit-mode" class="plain" aria-pressed="false" aria-controls="edit-tools">Edit the map</button>
        <div id="edit-tools" class="edit-tools" hidden>
          <button type="button" id="swap" class="plain" title="Swap to another drawing (S)">Swap</button>
          <button type="button" id="forward" class="plain" title="Bring in front of the symbol it overlaps (]); Shift-click for all the way">Bring forward</button>
          <button type="button" id="backward" class="plain" title="Send behind the symbol it overlaps ([); Shift-click for all the way">Send back</button>
          <button type="button" id="delete" class="plain" title="Remove (Delete)">Delete</button>
          <button type="button" id="undo" class="plain" title="Undo (Ctrl+Z)">Undo</button>
          <form id="rename" class="rename" hidden>
            <label for="label-text">Wording</label>
            <input id="label-text" type="text" maxlength="60" autocomplete="off">
            <button type="submit" class="plain">Rename</button>
          </form>
          <p id="edit-hint" class="hint" aria-live="polite"></p>
          <p class="hint keys">Keys: N picks the next item, arrows nudge, S swaps, ] and [ bring forward and send back, Delete removes, Ctrl+Z undoes.</p>
        </div>
      </div>
      <div class="map-frame">
        <div id="map-box" class="map-box">
          <div id="map" class="map" tabindex="0" aria-label="Map. Switch on editing to pick and move items."></div>
          <canvas id="relief" class="relief" hidden aria-hidden="true"></canvas>
        </div>
      </div>
      <figcaption id="caption" aria-live="polite"></figcaption>
    </figure>
  </div>
</body>
</html>
