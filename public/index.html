<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ink Fantasy Maps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #1a1714; --paper: #f6f1e6; --faint: #6b6358; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "IM Fell English", Georgia, serif;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    main {
      text-align: center;
      border: 2px solid var(--ink);
      outline: 1px solid var(--ink);
      outline-offset: 6px;
      padding: 48px 40px;
      max-width: 560px;
    }
    h1 {
      font-family: "IM Fell English SC", Georgia, serif;
      font-weight: 400;
      font-size: clamp(2rem, 7vw, 3.2rem);
      letter-spacing: 0.04em;
      margin: 0 0 12px;
    }
    p { margin: 0; font-style: italic; color: var(--faint); font-size: 1.15rem; }
  </style>
</head>
<body>
  <main>
    <h1>Ink Fantasy Maps</h1>
    <p>Here be dragons. The cartographer is still sharpening the quill.</p>
  </main>
</body>
</html>
