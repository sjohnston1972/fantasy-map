<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ink Fantasy Maps</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <nav class="top-nav" aria-label="Pages"><a href="/gallery/">Gallery</a></nav>
    <h1>Ink Fantasy Maps</h1>
    <p class="tag">Hand-inked region maps, drawn fresh from a single number.</p>
  </header>

  <div class="layout">
    <form id="settings" class="panel" aria-label="Map settings">
      <label class="field">
        <span>Seed</span>
        <span class="seed-row">
          <input id="seed" type="number" min="0" max="999999999" step="1" inputmode="numeric" required>
        </span>
        <small>Each map has a seed. Type one and press Enter to bring that map back.</small>
      </label>

      <label class="field">
        <span>Shape</span>
        <select id="shape">
          <option value="portrait">Portrait (A-paper shape)</option>
          <option value="landscape">Landscape (A-paper shape)</option>
        </select>
      </label>

      <label class="field">
        <span>Sea level <output id="sea-out" for="sea"></output></span>
        <input id="sea" type="range" min="5" max="90" step="1">
      </label>

      <label class="field">
        <span>Mountains <output id="mountains-out" for="mountains"></output></span>
        <input id="mountains" type="range" min="0" max="100" step="1">
      </label>

      <label class="field">
        <span>Forests <output id="forest-out" for="forest"></output></span>
        <input id="forest" type="range" min="0" max="100" step="1">
      </label>

      <label class="field">
        <span>Towns <output id="towns-out" for="towns"></output></span>
        <input id="towns" type="range" min="1" max="15" step="1">
      </label>

      <label class="check"><input id="show-relief" type="checkbox"> Show shaded relief</label>

      <button type="submit" class="generate">Generate a new map</button>

      <div class="exports" role="group" aria-labelledby="share-title">
        <span id="share-title" class="group-title">Share this map</span>
        <input id="share-link" type="text" readonly aria-label="Link to this map">
        <button type="button" id="copy-link" class="plain">Copy link</button>
        <output id="share-status" aria-live="polite"></output>
        <small class="fine">The link rebuilds this map, with your edits.</small>
      </div>

      <div class="exports" role="group" aria-labelledby="keep-title">
        <span id="keep-title" class="group-title">Keep this map</span>
        <label class="field"><span>Name</span><input id="map-name" type="text" maxlength="60" autocomplete="off"></label>
        <button type="button" id="save-mine" class="plain">Save to My maps</button>
        <button type="button" id="publish" class="plain">Publish to the public gallery</button>
        <output id="keep-status" aria-live="polite"></output>
        <small class="fine">My maps stay in this browser. Publishing shares the map, its name and a small picture with everyone. <a href="/gallery/">Open the gallery</a></small>
      </div>

      <div class="exports" role="group" aria-labelledby="export-title">
        <span id="export-title" class="group-title">Save the map</span>
        <button type="button" id="export-svg" class="plain">SVG (any size)</button>
        <button type="button" id="export-png" class="plain">PNG for screen</button>
        <button type="button" id="export-a3" class="plain">PNG for A3 print (300 dpi)</button>
        <output id="export-status" aria-live="polite"></output>
      </div>
    </form>

    <figure class="stage">
      <!-- Tools that do not depend on what is picked. Its height never changes as items are
           picked, so the map below never jumps under the pointer. -->
      <div class="toolbar">
        <button type="button" id="edit-mode" class="plain" aria-pressed="false" aria-controls="edit-tools">Edit the map</button>
        <div id="edit-tools" class="edit-tools" hidden>
          <div class="tool-group" role="group" aria-label="Add and pick">
            <button type="button" id="add-open" class="plain" aria-expanded="false" aria-controls="palette">Add symbols</button>
            <button type="button" id="select-area" class="plain" aria-pressed="false" title="Drag across the map to pick everything in the box (or Shift-drag)">Select area</button>
            <button type="button" id="paste" class="plain" title="Paste a copy (Ctrl+V pastes where the pointer is)" disabled>Paste</button>
          </div>
          <div class="tool-group" role="group" aria-label="History">
            <button type="button" id="undo" class="plain" title="Undo (Ctrl+Z)">Undo</button>
            <button type="button" id="redo" class="plain" title="Redo (Ctrl+Y or Ctrl+Shift+Z)">Redo</button>
          </div>
          <details class="keys">
            <summary>Keyboard shortcuts</summary>
            <p>Shift-click picks more, Shift-drag picks an area, Ctrl+A picks all symbols in view, N picks the next item, arrows nudge, S swaps, ] and [ bring forward and send back, , and . make smaller and bigger (or drag a corner of the box), Delete removes, Ctrl+C / Ctrl+X / Ctrl+V copy, cut and paste, Ctrl+Z undoes and Ctrl+Y redoes. + and - zoom, 0 shows the whole map.</p>
          </details>
        </div>
      </div>
      <div class="work">
        <div class="map-frame">
          <div id="map-box" class="map-box">
            <div id="map" class="map" tabindex="0" aria-label="Map. Switch on editing to pick and move items."></div>
            <canvas id="relief" class="relief" hidden aria-hidden="true"></canvas>
            <div id="sel-box" class="sel-box" hidden>
              <span data-corner="nw" title="Drag to resize"></span><span data-corner="ne" title="Drag to resize"></span><span data-corner="sw" title="Drag to resize"></span><span data-corner="se" title="Drag to resize"></span>
            </div>
            <!-- Actions for the picked items, floating just above them. -->
            <div id="sel-bar" class="sel-bar" role="toolbar" aria-label="Picked items" hidden>
              <button type="button" id="swap" class="plain" title="Swap to another drawing (S)">Swap</button>
              <button type="button" id="forward" class="plain" title="Bring in front of the symbol it overlaps (]); Shift-click for all the way">Forward</button>
              <button type="button" id="backward" class="plain" title="Send behind the symbol it overlaps ([); Shift-click for all the way">Back</button>
              <button type="button" id="smaller" class="plain" title="Make the picked items smaller (,)">Smaller</button>
              <button type="button" id="bigger" class="plain" title="Make the picked items bigger (.)">Bigger</button>
              <button type="button" id="copy" class="plain" title="Copy the picked items (Ctrl+C)">Copy</button>
              <button type="button" id="cut" class="plain" title="Cut the picked items (Ctrl+X)">Cut</button>
              <button type="button" id="delete" class="plain danger" title="Remove (Delete)">Delete</button>
            </div>
            <div class="zoom-ctl" role="group" aria-label="Zoom">
              <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
              <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out (-)">&minus;</button>
              <button type="button" id="zoom-fit" title="Show the whole map (0)">Fit</button>
              <output id="zoom-level" aria-live="polite">100%</output>
            </div>
            <!-- What to do next, and the wording box for a picked name, over the map's foot. -->
            <div class="map-status">
              <form id="rename" class="rename" hidden>
                <label for="label-text">Wording</label>
                <input id="label-text" type="text" maxlength="60" autocomplete="off">
                <button type="submit" class="plain">Rename</button>
              </form>
              <p id="edit-hint" class="status-hint" aria-live="polite"></p>
            </div>
          </div>
        </div>
        <aside id="palette" class="palette" aria-label="Add symbols" hidden>
          <div class="pal-head">
            <label>Kind <select id="pal-role"></select></label>
            <label>Size <input id="pal-size" type="range" min="40" max="250" step="5" value="100"> <output id="pal-size-out" for="pal-size">100%</output></label>
            <label class="check"><input id="pal-vary" type="checkbox" checked> Vary size and facing</label>
            <label class="check"><input id="pal-mix" type="checkbox"> Mix drawings of this kind</label>
            <button type="button" id="pal-done" class="plain">Done</button>
          </div>
          <p id="pal-hint" class="hint" aria-live="polite"></p>
          <div id="pal-grid" class="pal-grid" role="listbox" aria-label="Drawings"></div>
        </aside>
      </div>
      <figcaption id="caption" aria-live="polite"></figcaption>
    </figure>
  </div>
</body>
</html>
