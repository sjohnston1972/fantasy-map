<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ink Fantasy Maps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1>Ink Fantasy Maps</h1>
    <p class="tag">Here be dragons, eventually. For now, the lie of the land.</p>
  </header>

  <div class="layout">
    <form id="settings" class="panel" aria-label="Map settings">
      <label class="field">
        <span>Seed</span>
        <span class="seed-row">
          <input id="seed" type="number" min="0" max="999999999" step="1" inputmode="numeric" required>
        </span>
        <small>Each map has a seed. Type one and press Enter to bring that map back.</small>
      </label>

      <label class="field">
        <span>Shape</span>
        <select id="shape">
          <option value="portrait">Portrait (1600 by 2400)</option>
          <option value="landscape">Landscape (2400 by 1600)</option>
          <option value="square">Square (2000 by 2000)</option>
        </select>
      </label>

      <label class="field">
        <span>Sea level <output id="sea-out" for="sea"></output></span>
        <input id="sea" type="range" min="5" max="90" step="1">
      </label>

      <label class="field">
        <span>Mountains <output id="mountains-out" for="mountains"></output></span>
        <input id="mountains" type="range" min="0" max="100" step="1">
      </label>

      <button type="submit" class="generate">Generate a new map</button>

      <p class="note">Early preview: the terrain is grey relief, lit from the top left. Rivers and lakes are drawn in blue; every river runs downhill to the sea or a lake. Towns, ink symbols and labels arrive in later stages.</p>
    </form>

    <figure class="stage">
      <canvas id="map" role="img"></canvas>
      <figcaption id="caption" aria-live="polite"></figcaption>
    </figure>
  </div>
</body>
</html>
